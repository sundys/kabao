name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # sqlite3 的 native asset hook 默认从 GitHub Releases 下载预编译库。
      # pubspec.yaml 为国内网络配了 ghfast.top 镜像，但 GitHub 托管 runner
      # 直连该镜像会超时（errno 110），导致测试与 APK 构建整体失败。
      # 托管 runner 访问 github.com 是通的，这里在 CI 上去掉镜像前缀。
      - name: Use direct GitHub download for SQLite
        run: |
          sed -i 's#url_pattern: "https://ghfast.top/https://github.com/#url_pattern: "https://github.com/#' pubspec.yaml
          grep -n "url_pattern" pubspec.yaml

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug
