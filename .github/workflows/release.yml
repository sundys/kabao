name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kabao-release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/kabao-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      # 按 CPU 架构分别构建 APK：armv8 / armv7。
      - name: Build signed APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --target-platform android-arm64

      - name: Build signed APK (armeabi-v7a)
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols --target-platform android-arm

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/kabao-release.jks" android/key.properties

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             dist/kabao-${{ steps.version.outputs.VERSION }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             dist/kabao-${{ steps.version.outputs.VERSION }}-armeabi-v7a.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             dist/kabao-${{ steps.version.outputs.VERSION }}.aab

      - name: Prepare release notes
        id: notes
        run: |
          # 手写的更新说明（docs/release-notes/<tag>.md）优先；缺失时留空，
          # 由 generate_release_notes 生成的提交列表兜底。
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" dist/RELEASE_NOTES.md
          else
            : > dist/RELEASE_NOTES.md
          fi

      - name: Delete stale release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 同一标签重新发布时，复用已存在的 release 会保留旧正文（只换掉
          # 附件）。先删除再由下一步重建，保证正文与本次 tag 一致。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/kabao-*-arm64-v8a.apk
            dist/kabao-*-armeabi-v7a.apk
            dist/kabao-*.aab
          generate_release_notes: true
